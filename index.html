<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathematical Biology Simulation</title><style>:root{--yellow:#FFF2A8;--aqua:#9CC4B2;--aqua-ink:#527F6C;--lilac:#CAB6CF;--lilac-ink:#806B87;--periwinkle:#A8ADD0;--green:#A7BFA0;--green-ink:#617D5A;--ink:#343A36;--muted:#6D746F;--border:#E6E9E6;--grid:#E9ECE9;--paper:#fff;--soft:#F8FAF8;--pale:#EFF4EE}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:15px/1.58 system-ui,-apple-system,'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--green-ink);outline-offset:3px}.layout{max-width:1740px;margin:auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:30px;padding:24px 28px}.sidebar{position:sticky;top:24px;align-self:start;border:1px solid var(--border);border-radius:18px;background:var(--paper);padding:9px;max-height:calc(100vh - 48px);overflow-y:auto;scrollbar-width:thin}.nav-chapter+.nav-chapter{border-top:1px solid var(--border);margin-top:5px;padding-top:5px}.chapter-toggle{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:13px 10px;text-align:left;font-size:14px;font-weight:650;color:#454C47}.chapter-number{font-size:12px;display:grid;place-items:center;flex-shrink:0;width:25px;height:25px;background:transparent;color:#717874;border-radius:8px}.chevron{margin-left:auto;color:#8B918C;font-size:17px}.model-link{display:block;width:100%;padding:10px 12px 10px 42px;text-align:left;background:none;border:0;border-radius:10px;font-size:14px;line-height:1.4;color:#59615B}.model-link:hover{background:var(--soft)}.model-link.active{background:var(--pale);color:var(--green-ink);font-weight:650}.main{min-width:0}.source{margin:0 0 9px;color:var(--muted);font-size:13px}.model-heading h1{font-size:clamp(26px,3vw,35px);font-weight:650;line-height:1.2;letter-spacing:-.035em;margin:0 0 11px}.description{margin:0;max-width:900px;color:#5D655F;line-height:1.75}.model-heading{margin-bottom:22px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}.views{min-width:0;display:grid;gap:18px}.model-view{min-width:0;background:var(--paper);border:1px solid var(--border);border-radius:18px;overflow:hidden}.model-view>h2{font-size:15px;margin:16px 22px 0;font-weight:650;color:#4D554F}.equations{padding:17px 22px;background:var(--soft);border-bottom:1px solid var(--border);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:26px;row-gap:5px;align-items:center}.equations math,.fp-formulas math{font-size:16px;line-height:2;margin:5px 0;text-align:left;math-style:normal}.equations math:only-of-type{grid-column:1/-1}.mm-equations{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.mm-reaction{display:flex;align-items:center;justify-content:center;min-width:0}.mm-rates{display:grid;gap:4px;align-content:center;min-width:0}.mm-equations .equation-note{grid-column:1/-1}@media(max-width:600px){.mm-equations{grid-template-columns:1fr}.mm-reaction{padding:6px}.mm-rates{justify-items:center}}.equation-note{grid-column:1/-1;font-size:13px;color:var(--muted);margin:7px 0 0;line-height:1.7}.chart-wrap{padding:14px 14px 9px}.plot{display:block;width:min(100%,590px);height:auto;aspect-ratio:1;margin:0 auto;cursor:crosshair}.legend{display:flex;flex-wrap:wrap;gap:9px 18px;padding:9px 13px;color:#4C534E;font-size:13px;line-height:1.5}.legend span{display:inline-flex;align-items:center;gap:7px}.legend i{width:10px;height:10px;border-radius:50%;background:var(--marker);display:inline-block;flex:0 0 auto}.legend i.square{border-radius:2px}.sim-status{font-size:13px;color:var(--muted);padding:0 13px;margin:7px 0 10px;min-height:20px}.fp-formulas:not(:empty){border-top:1px solid var(--border);padding:13px 22px;overflow:auto;background:#fff}.fp-formulas h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 7px}.fp-formulas math{font-size:16px}.controls{border:1px solid var(--border);border-radius:18px;background:var(--paper);padding:20px;position:sticky;top:24px}.controls h2{font-size:16px;font-weight:650;margin:0 0 17px}.controls .initial-title{border-top:1px solid var(--border);padding-top:17px;margin-top:19px}.control-row{margin:0 0 17px}.control-row label{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;font-size:14px;color:#4E5650;line-height:1.45;margin-bottom:7px}.number-input{width:66px;flex-shrink:0;border:1px solid var(--border);border-radius:8px;background:#fff;color:#343A36;text-align:center;padding:5px 2px;font-size:14px;font-variant-numeric:tabular-nums;appearance:textfield;-moz-appearance:textfield}.number-input::-webkit-inner-spin-button,.number-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.control-row input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:22px;margin:0;background:transparent;display:block;cursor:pointer}.control-row input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:6px;background:linear-gradient(to right,var(--green) var(--fill),#E5E9E5 var(--fill))}.control-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;margin-top:-5px;width:13px;height:13px;border:2px solid #fff;border-radius:50%;background:var(--green-ink);box-shadow:0 0 0 1px #8FA58B}.control-row input[type=range]::-moz-range-track{height:3px;background:#E5E9E5;border:0;border-radius:6px}.control-row input[type=range]::-moz-range-progress{height:3px;background:var(--green)}.control-row input[type=range]::-moz-range-thumb{width:10px;height:10px;border:2px solid white;background:var(--green-ink);border-radius:50%;box-shadow:0 0 0 1px #8FA58B}.actions{display:flex;gap:9px;margin-top:20px}.actions button{flex:1;border:1px solid var(--border);border-radius:9px;background:white;color:#454C47;font-size:14px;padding:9px 12px}.actions .primary{background:var(--green-ink);border-color:var(--green-ink);color:white}.control-hint{font-size:12px;line-height:1.55;color:var(--muted);margin:12px 0 0}.connection{font-size:13px;color:var(--muted);margin:0 5px 15px;line-height:1.7}.connection b{color:#4D554F;font-weight:650}.paired .plot{max-width:480px}.paired{grid-template-columns:repeat(2,minmax(0,1fr))}.paired .model-view{align-self:start}.bifurcation-view{grid-column:1/-1}.bifurcation-view .plot{max-width:570px}.spatial-view .plot{max-width:560px}.spatial-phase .plot{max-width:540px}.branch-legend{justify-content:center}.status-empty{display:none}@media(max-width:1250px){.layout{grid-template-columns:270px minmax(0,1fr);padding:20px;gap:20px}.workspace{grid-template-columns:minmax(0,1fr)}.controls{position:static;display:grid;grid-template-columns:1fr 1fr;gap:0 24px}.controls h2,.controls .initial-title,.actions,.control-hint{grid-column:1/-1}.paired{grid-template-columns:1fr 1fr}}@media(max-width:850px){.layout{display:block;padding:14px}.sidebar{position:static;max-height:270px;margin-bottom:20px}.workspace{gap:15px}.paired{grid-template-columns:1fr}.paired .bifurcation-view{grid-column:auto}.controls{padding:17px;gap:0 18px}.model-heading h1{font-size:27px}.description{font-size:14px}.equations{padding:14px;column-gap:12px}.equations math,.fp-formulas math{font-size:15px}.chart-wrap{padding:8px}.plot{max-width:600px}.legend{font-size:13px;gap:8px 14px}.number-input{font-size:14px}.fp-formulas{padding:12px!important}}@media(max-width:520px){.controls{display:block}.equations{grid-template-columns:1fr}.equations math{grid-column:1!important}.model-heading h1{font-size:25px}.plot{width:100%}.chart-wrap{padding:4px}.legend{font-size:12px;padding:7px}.number-input{width:64px}.control-row input[type=range]{height:27px}}

</style></head><body><div class="layout"><nav id="nav" class="sidebar" aria-label="Course chapters"></nav><main class="main" id="detail"></main></div><script>const models=[
{id:'logistic',ch:1,title:'Logistic population growth',type:'1D ODE · nondimensional',desc:'With u = x/K and τ = rt, the logistic model has a unit carrying capacity and unit growth rate.',eq:'u = x/K, τ = rt\ndu/dτ = u(1 − u)',compare:'The exponential model is the low-density limit of logistic growth; after scaling population by K and time by 1/r, the logistic equation has no free parameters.',state:['u'],range:[[0,1.2]],params:{},init:[.1],f:(s)=>[s[0]*(1-s[0])]},
{id:'saddle-node',ch:1,title:'Saddle-node bifurcation',type:'1D ODE · dimensionless normal form',desc:'A stable and an unstable equilibrium are created together as the control parameter crosses its critical value.',eq:'du/dτ = r − u²\nEquilibria (r > 0): u* = ±√r',compare:'The harvested logistic and spruce budworm models show biological settings where equilibria collide or disappear; this dimensionless normal form isolates that local transition.',state:['u'],range:[[-2,2]],params:{mu:[.5,-1,1,.02]},init:[-1.5],f:(s,p)=>[p.mu-s[0]*s[0]]},
{id:'transcritical',ch:1,title:'Transcritical bifurcation',type:'1D ODE · dimensionless normal form',desc:'Two equilibria meet and exchange stability as a parameter changes sign.',eq:'du/dτ = ru − u²\nEquilibria: u* = 0, r',compare:'Unlike a saddle-node, the equilibria already exist on both sides of the transition; they cross and swap stability.',state:['u'],range:[[-2,2]],params:{mu:[.5,-1,1,.02]},init:[1.3],f:(s,p)=>[p.mu*s[0]-s[0]*s[0]]},
{id:'pitchfork-super',ch:1,title:'Supercritical pitchfork',type:'1D ODE · dimensionless normal form',desc:'A symmetric pair of stable equilibria branches from an unstable central state when the parameter becomes positive.',eq:'du/dτ = ru − u³\nFor r > 0: u* = 0, ±√r',compare:'This normal form requires symmetry. It differs from transcritical bifurcation, where two branches cross rather than split symmetrically.',state:['u'],range:[[-2,2]],params:{mu:[.5,-1,1,.02]},init:[.3],f:(s,p)=>[p.mu*s[0]-s[0]*s[0]*s[0]]},
{id:'pitchfork-sub',ch:1,title:'Subcritical pitchfork',type:'1D ODE · dimensionless normal form',desc:'An unstable symmetric pair meets the stable central equilibrium as the parameter changes sign.',eq:'du/dτ = ru + u³\nFor r < 0: u* = 0, ±√(−r)',compare:'The local normal form predicts unstable outer branches; higher-order terms in a biological model may create stabilising states farther away.',state:['u'],range:[[-2,2]],params:{mu:[-.5,-1,1,.02]},init:[.3],f:(s,p)=>[p.mu*s[0]+s[0]*s[0]*s[0]]},
{id:'exponential',ch:1,title:'Exponential growth and decay',type:'1D ODE',desc:'A large population in a closed environment changes at a per-capita rate that is independent of its current size.',eq:'dx/dt = r x',compare:'This is the low-density limit of logistic growth. With r > 0 it grows without bound; with r < 0 it decays.',state:['x'],range:[[0,12]],params:{r:[.45,-.5,1,.05]},init:[1],f:(s,p)=>[p.r*s[0]]},
{id:'mass-action',ch:1,title:'Mass-action reaction kinetics',type:'2D ODE · A–B projection',desc:'The rate of an elementary reaction is proportional to the product of reactant concentrations. Here, two reactants form a product in a single irreversible step.',eq:'A + 2B → C\ndA/dt = −kAB²\ndB/dt = −2kAB²\ndC/dt = kAB²',compare:'Mass action supplies the general recipe for writing chemical-kinetic ODEs. Michaelis–Menten adds enzyme binding, a transient complex and catalytic product release.',state:['A','B'],range:[[0,5],[0,5]],params:{k:[.15,.02,.4,.01]},init:[4.5,4.5],f:(s,p)=>[-p.k*s[0]*s[1]*s[1],-2*p.k*s[0]*s[1]*s[1]]},
{id:'sis',ch:1,title:'SIS epidemic model',type:'1D ODE · nondimensional reduced model',desc:'Let u = I/N be the infected fraction, τ = λt and q = (γ + δ)/λ. Infection persists for q < 1 and dies out for q ≥ 1.',eq:'u = I/N, τ = λt, q = (γ + δ)/λ\ndu/dτ = u(1 − u − q)',compare:'This single-population model reduces to logistic growth with a mortality threshold. Chapter 2 adds cross-infection between two distinct groups.',state:['u'],range:[[0,1.2]],params:{q:[.3,0,1.5,.1]},init:[.1],f:(s,p)=>[s[0]*(1-s[0]-p.q)]},
{id:'harvest',ch:1,title:'Logistic growth with harvesting',type:'1D ODE · nondimensional',desc:'With u = x/K, τ = rt and h = H/(rK), harvesting removes the positive equilibrium pair at the saddle-node threshold h = 1/4.',eq:'u = x/K, τ = rt, h = H/(rK)\ndu/dτ = u(1 − u) − h',compare:'This is the nondimensional logistic equation with a constant harvest term; unlike the unharvested model, its equilibria disappear when h exceeds 1/4.',state:['u'],range:[[0,1.2]],params:{h:[.15,0,.5,.1]},init:[.1],f:(s,p)=>[s[0]*(1-s[0])-p.h]},
{id:'budworm',ch:1,title:'Spruce budworm outbreak',type:'1D ODE · nondimensional',desc:'The notes scale budworm density by A and time by A/B, reducing the model to two dimensionless parameters R and k.',eq:'x = N/A, τ = Bt/A, R = rA/B, k = K/A\ndx/dτ = Rx(1 − x/k) − x²/(1 + x²)',compare:'The dimensionless form separates the growth parameter R from the relative carrying capacity k. It retains the low-density refuge and outbreak bistability.',state:['x'],range:[[0,20]],params:{R:[.3,.1,1.5,.1],k:[20,2,30,1]},init:[1],f:(s,p)=>[p.R*s[0]*(1-s[0]/p.k)-s[0]*s[0]/(1+s[0]*s[0])]},
{id:'mm',ch:1,title:'Michaelis–Menten enzyme kinetics',type:'2D ODE · dimensionless substrate–complex system',desc:'The substrate binds an enzyme, forms a complex, then releases product and regenerates the enzyme. The equations use the nondimensional variables and parameters from the notes.',eq:'S + E ⇌ SE → P + E\nε dv/dτ = u − (u + K)v\ndu/dτ = −u + (u + K − λ)v',compare:'The quasi-steady-state approximation sets ε = 0, giving v = u/(u + K) and du/dτ = −λu/(u + K).',state:['u','v'],range:[[0,1.05],[0,1.05]],params:{epsilon:[.5,.1,1,.1],K:[1,.1,2,.1],lambda:[1,.1,2,.1]},init:[1,0],f:(s,p)=>[-s[0]+(s[0]+p.K-p.lambda)*s[1],(s[0]-(s[0]+p.K)*s[1])/p.epsilon]},
{id:'pdpc',ch:1,title:'Phosphorylation–dephosphorylation cycle',type:'1D ODE · reduced',desc:'Kinase and phosphatase enzymes drive a protein between unmodified W and modified W*. Saturating enzyme kinetics can create a sharp, switch-like response.',eq:'dW*/dt = v₁(W) − v₂(W*)\nv₁ = V₁ W/(K₁ + W),   v₂ = V₂ W*/(K₂ + W*)\nW + W* = Wₜ',compare:'This two-enzyme cycle extends the single-substrate Michaelis–Menten pathway and can produce ultrasensitivity when both enzymes are saturated.',state:['W*'],range:[[0,1]],params:{V1:[.7,.1,1.5,.05],V2:[.7,.1,1.5,.05],K1:[.08,.02,.4,.01],K2:[.08,.02,.4,.01],Wt:[1,.5,1.5,.05]},init:[.08],f:(s,p)=>{let w=Math.max(0,p.Wt-s[0]);return[p.V1*w/(p.K1+w)-p.V2*s[0]/(p.K2+s[0])]}},
{id:'sis2',ch:2,title:'Two interacting SIS populations',type:'2D ODE',desc:'Infection spreads between two groups, each with its own recovery rate and cross-group transmission rate.',eq:'du/dt = R(1 − u)v − u\ndv/dt = R*(1 − v)u − v',compare:'The one-population SIS model reduces to logistic growth. Here, cross-infection couples the groups, so the phase portrait reveals whether infection dies out or persists in both.',state:['u','v'],range:[[0,1],[0,1]],params:{R:[1.4,.2,3,.05],Rs:[1.1,.2,3,.05]},init:[.12,.7],f:(s,p)=>[p.R*(1-s[0])*s[1]-s[0],p.Rs*(1-s[1])*s[0]-s[1]]},
{id:'lv',ch:2,title:'Lotka–Volterra predator–prey',type:'2D ODE',desc:'Prey grow without predators; predators decline without prey. Encounters transfer growth from prey to predator.',eq:'dN/dt = aN − bNP\ndP/dt = −dP + cNP',compare:'The classical model has closed orbits around coexistence, so oscillation amplitude depends on initial conditions. Chapter 3 adds saturation and logistic growth for more realistic dynamics.',state:['N','P'],range:[[0,12],[0,8]],params:{a:[1,.2,1.8,.05],b:[.18,.03,.4,.01],c:[.12,.03,.35,.01],d:[.7,.2,1.4,.05]},init:[5,2],f:(s,p)=>[p.a*s[0]-p.b*s[0]*s[1],-p.d*s[1]+p.c*s[0]*s[1]]},
{id:'switch',ch:2,title:'Autoregulatory genetic switch',type:'2D ODE',desc:'A gene product stimulates its own production through positive feedback. Protein and mRNA dynamics can produce multiple steady states.',eq:'du/dτ = a v − b u\ndv/dτ = u²/(1 + u²) − v\nu: protein concentration; v: mRNA concentration',compare:'The course uses positive autoregulation, not a two-gene mutual-repression circuit. The resulting bistability is conceptually related to the spruce budworm’s refuge/outbreak states.',state:['u','v'],range:[[0,4],[0,1.2]],params:{a:[1.2,.2,2,.05],b:[.5,.1,1,.02]},init:[.2,.9],f:(s,p)=>[p.a*s[1]-p.b*s[0],s[0]*s[0]/(1+s[0]*s[0])-s[1]]},
{id:'wc',ch:2,title:'Wilson–Cowan neural populations',type:'2D ODE',desc:'Mean firing rates of two neural populations relax toward sigmoid responses to recurrent and cross-population input.',eq:'τ₁ du₁/dt = −u₁ + F(w₁₁u₁ + w₁₂u₂ + I₁)\nτ₂ du₂/dt = −u₂ + F(w₂₁u₁ + w₂₂u₂ + I₂)\nF(z) = 1/(1 + e^(−β(z − uT)))',compare:'Unlike spiking-neuron models, Wilson–Cowan tracks population firing rates. The course’s two-group setting describes competition and bistable dominance.',state:['u₁','u₂'],range:[[0,1],[0,1]],params:{gain:[8,2,16,.5],cross:[2,-4,5,.1],bias:[0,-2,2,.1]},init:[.15,.75],f:(s,p)=>{let F=z=>1/(1+Math.exp(-p.gain*z));return[-s[0]+F(2*s[0]-p.cross*s[1]+p.bias),-s[1]+F(2*s[1]-p.cross*s[0]+p.bias)]}},
{id:'competition',ch:2,title:'Competition between two species',type:'2D ODE',desc:'Two populations grow logistically in isolation; each reduces the other’s per-capita growth through interspecific competition.',eq:'dN₁/dt = r₁N₁(1 − N₁/K₁ − b₁₂N₂/K₁)\ndN₂/dt = r₂N₂(1 − N₂/K₂ − b₂₁N₁/K₂)',compare:'The Lotka–Volterra model couples prey and predator through consumption. This model uses competitive suppression and can produce coexistence or winner-take-all outcomes.',state:['N₁','N₂'],range:[[0,12],[0,12]],params:{b12:[.8,0,2,.05],b21:[.8,0,2,.05]},init:[2,7],f:(s,p)=>[s[0]*(1-s[0]/10-p.b12*s[1]/10),.9*s[1]*(1-s[1]/10-p.b21*s[0]/10)]},
{id:'hopfield',ch:2,title:'Continuous-time Hopfield network',type:'2D ODE · two-unit example',desc:'A continuous neural network with symmetric weights descends an energy function and settles into a stable memory state.',eq:'τᵢ dxᵢ/dt = −xᵢ + Σⱼ Wᵢⱼ g(xⱼ) + Iᵢ\nWᵢⱼ = Wⱼᵢ;   g(z) = tanh(βz)',compare:'The Wilson–Cowan model focuses on interacting population firing rates. The Hopfield model emphasizes symmetric connectivity, an energy landscape and associative memory.',state:['x₁','x₂'],range:[[-1.5,1.5],[-1.5,1.5]],params:{coupling:[1,-1.5,1.5,.05],beta:[2,.5,5,.1]},init:[-.9,.6],f:(s,p)=>[-s[0]+Math.tanh(p.beta*(s[0]+p.coupling*s[1])), -s[1]+Math.tanh(p.beta*(p.coupling*s[0]+s[1]))]},
{id:'feedback',ch:3,title:'Delayed negative-feedback oscillator',type:'2D ODE',desc:'A two-component feedback loop can spiral toward a resting state. Strong positive feedback relative to decay produces damped oscillations.',eq:'dx/dt = f(y) − α₁x\ndy/dt = g(x) − α₂y',compare:'Damped oscillations lose amplitude. Adding further stages of inhibition, as in the repressilator, can destabilize the rest state and yield sustained oscillations.',state:['x','y'],range:[[0,5],[0,5]],params:{decay:[.45,.1,1,.02],feedback:[2,.2,4,.05]},init:[.3,3.8],f:(s,p)=>[2/(1+s[1]*s[1])-p.decay*s[0],p.feedback*s[0]/(1+s[0])-p.decay*s[1]]},

{id:'hopf',ch:3,title:'Hopf bifurcation',type:'2D ODE',desc:'The canonical local model for oscillations emerging as a fixed point loses stability and a limit cycle appears.',eq:'dA/dt = (μ + iω)A + (σ + iγ)|A|²A\nIn polar form: dr/dt = μr + σr³; dθ/dt = ω + γr²',compare:'The normal form isolates the local transition near a Hopf bifurcation. FitzHugh–Nagumo and neuronal oscillators provide biological systems with comparable phase-plane behavior.',state:['x','y'],range:[[-2.5,2.5],[-2.5,2.5]],params:{mu:[.5,-.5,1,.05],sigma:[-1,-1.5,-.2,.05],omega:[1,.2,2,.05]},init:[.1,.1],f:(s,p)=>{let q=s[0]*s[0]+s[1]*s[1];return[p.mu*s[0]-p.omega*s[1]+p.sigma*q*s[0],p.omega*s[0]+p.mu*s[1]+p.sigma*q*s[1]]}},

{id:'hh',ch:3,title:'Hodgkin–Huxley action potential',type:'4D ODE · V–n projection',desc:'A conductance-based model describes membrane voltage and voltage-dependent sodium and potassium channel gates during an action potential.',eq:'Cₘ dV/dt = I − gNa m³h(V−ENa) − gK n⁴(V−EK) − gL(V−EL)\ndX/dt = αX(V)(1−X) − βX(V)X,   X ∈ {m,n,h}',compare:'FitzHugh–Nagumo is a lower-dimensional reduction designed for qualitative analysis. Hodgkin–Huxley retains separate channel-gating variables and biophysical conductances.',state:['V','m','h','n'],range:[[-90,50],[0,1]],params:{current:[10,0,25,.5]},init:[-65,.05,.6,.32],f:(s,p)=>{let [V,m,h,n]=s;let am=V===-40?1:0.1*(V+40)/(1-Math.exp(-(V+40)/10));let bm=4*Math.exp(-(V+65)/18);let ah=.07*Math.exp(-(V+65)/20);let bh=1/(1+Math.exp(-(V+35)/10));let an=V===-55?.1:.01*(V+55)/(1-Math.exp(-(V+55)/10));let bn=.125*Math.exp(-(V+65)/80);let ina=120*m*m*m*h*(V-50),ik=36*Math.pow(n,4)*(V+77),il=.3*(V+54.4);return[(p.current-ina-ik-il),am*(1-m)-bm*m,ah*(1-h)-bh*h,an*(1-n)-bn*n]}},

let cache=null,lastFrame=0,spatialCache=null;
function trajectory(m,p,y){
 const key=JSON.stringify([m.id,p,y]);if(cache?.key===key)return cache.path;
 let path=[y.slice()],t=0,h=m.id==='hh'?.005:.025,T=m.id==='fhn'?300:40,status='';const times=[0];
 for(let step=0;step<80000&&t<T;step++){
  h=Math.min(h,T-t);let a=rk4(m.f,y,h,p),half=rk4(m.f,y,h/2,p),b=rk4(m.f,half,h/2,p);
  let err=Math.max(...a.map((v,j)=>Math.abs(v-b[j])/(1e-7+1e-5*Math.max(Math.abs(y[j]),Math.abs(b[j])))))/15;
  if(!Number.isFinite(err)){h/=2;if(h<1e-8){status='Integration stopped: singular or divergent solution.';break}continue}
  if(err>1){h*=Math.max(.2,.85*Math.pow(err,-.2));continue}
  y=b;t+=h;path.push(y.slice());times.push(t);
  if(m.id==='harvest'&&y[0]<=0){path[path.length-1]=[0];status='Population reached extinction; harvesting stops here.';break}
  if(y.some(v=>Math.abs(v)>1e5)){status='Unbounded trajectory; integration stopped.';break}
  h=Math.min(m.id==='hh'?.025:.15,h*Math.min(2,err>0?.9*Math.pow(err,-.2):2));
 }
 cache={key,path,times,status};return path;
}
function roots(m,p){
 let n=m.state.length;if(n>2)return [];
 const f=s=>m.f(s,p),found=[],r=m.range;
 const add=s=>{if(s.every((v,i)=>Number.isFinite(v)&&v>=r[i][0]-1e-6&&v<=r[i][1]+1e-6)&&Math.hypot(...f(s))<1e-6&&!found.some(z=>Math.hypot(...z.map((v,i)=>v-s[i]))<1e-4))found.push(s)};
 for(let i=0;i<=24;i++)for(let j=0;j<(n===1?1:25);j++){
  let s=[r[0][0]+i/24*(r[0][1]-r[0][0])];if(n===2)s.push(r[1][0]+j/24*(r[1][1]-r[1][0]));
  for(let k=0;k<40;k++){let v=f(s);if(Math.hypot(...v)<1e-9)break;let J=jac(m,p,s),d;
   if(n===1){if(Math.abs(J[0][0])<1e-12)break;d=[v[0]/J[0][0]]}else{let det=J[0][0]*J[1][1]-J[0][1]*J[1][0];if(Math.abs(det)<1e-12)break;d=[(v[0]*J[1][1]-v[1]*J[0][1])/det,(J[0][0]*v[1]-J[1][0]*v[0])/det]}
   s=s.map((v,k)=>v-d[k]);if(s.some(v=>!Number.isFinite(v)||Math.abs(v)>1e6))break;
  }add(s);
 }return found;
}
function jac(m,p,s){let n=s.length,J=Array.from({length:n},()=>[]);for(let j=0;j<n;j++){let a=s.slice(),b=s.slice(),e=1e-5*(1+Math.abs(s[j]));a[j]+=e;b[j]-=e;let fa=m.f(a,p),fb=m.f(b,p);for(let i=0;i<n;i++)J[i][j]=(fa[i]-fb[i])/(2*e)}return J}
function stability(m,p,s){let J=jac(m,p,s);if(s.length===1)return Math.abs(J[0][0])<1e-5?'Nonhyperbolic':J[0][0]<0?'Stable':'Unstable';let tr=J[0][0]+J[1][1],det=J[0][0]*J[1][1]-J[0][1]*J[1][0];return Math.abs(det)<1e-6?'Nonhyperbolic':det<0?'Saddle':Math.abs(tr)<1e-5?'Neutral / inconclusive':tr<0?'Stable':'Unstable'}

function rk4(f,y,h,p){let add=(a,b,k)=>a.map((v,i)=>v+k*b[i]);let k1=f(y,p),k2=f(add(y,k1,h/2),p),k3=f(add(y,k2,h/2),p),k4=f(add(y,k3,h),p);return y.map((v,i)=>v+h*(k1[i]+2*k2[i]+2*k3[i]+k4[i])/6)}

function shoot(p,mode,z){const {alpha:a,beta:b,c}=p,e=mode==='A'?1e-3:1e-5,lp=(-c+Math.sqrt(c*c+4*a*b))/2;let l3=(1/c)/(a*(1-b)+1+1/(c*c)),l2=(c+1/c)*l3;let y=mode==='B'?[Math.exp(z),e,-(c+lp)*e]:[1-l2*e-l3*z*e,e,z*e];const path=[y.slice()],f=s=>[-s[0]*(1-s[0]-s[1])/c,s[2],-c*s[2]-a*s[1]*(s[0]-b)];let best=Infinity,at=0;const h=-.02;for(let i=0;i<12000;i++){let k1=f(y),k2=f(y.map((v,j)=>v+h*k1[j]/2)),k3=f(y.map((v,j)=>v+h*k2[j]/2)),k4=f(y.map((v,j)=>v+h*k3[j]));y=y.map((v,j)=>v+h*(k1[j]+2*k2[j]+2*k3[j]+k4[j])/6);if(y.some(v=>!Number.isFinite(v)||Math.abs(v)>3)||y[0]<-1e-6||y[1]<-1e-6)break;path.push(y);let d=Math.hypot(y[0]-b,y[1]-(1-b),y[2]);if(d<best){best=d;at=path.length-1}if(d<1e-7)break}return {score:best,path:path.slice(0,at+1),z};}



let waveConnection='B';
function boundaryWave(p){
 if(p.c<=0)return {ok:false,reason:'These A/B examples use c > 0. No connection has been computed for c <= 0.'};
 let L=45,r=solveWave(p,waveConnection,180,L);

  let best={score:Infinity},dz=.22;for(let i=0;i<=100;i++){let v=shoot(p,'B',-25+i*dz);if(v.score<best.score)best=v}

 }
 if(!r.ok)return {ok:false,reason:'No verified nonnegative connection found at these parameters. This is a numerical failure, not a proof of nonexistence. Try the example preset.'};
 const fine=solveWave(p,waveConnection,360,L,r.path);if(!fine.ok)return {ok:false,reason:'Mesh refinement failed; no trajectory is displayed.'};

}
function drawWaveTime(solution,p){
