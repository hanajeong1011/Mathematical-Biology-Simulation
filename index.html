max-width:900px;color:#5D655F;line-height:1.75}.model-heading{margin-bottom:22px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}.views{min-width:0;display:grid;gap:18px}.model-view{min-width:0;background:var(--paper);border:1px solid var(--border);border-radius:18px;overflow:hidden}.model-view>h2{font-size:15px;margin:16px 22px 0;font-weight:650;color:#4D554F}.equations{padding:17px 22px;background:var(--soft);border-bottom:1px solid var(--border);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:26px;row-gap:5px;align-items:center}.equations math,.fp-formulas math{font-size:16px;line-height:2;margin:5px 0;text-align:left;math-style:normal}.equations math:only-of-type{grid-column:1/-1}.equation-note{grid-column:1/-1;font-size:13px;color:var(--muted);margin:7px 0 0;line-height:1.7}.chart-wrap{padding:14px 14px 9px}.plot{display:block;width:min(100%,590px);height:auto;aspect-ratio:1;margin:0 auto;cursor:crosshair}.legend{display:flex;flex-wrap:wrap;gap:9px 18px;padding:9px 13px;color:#4C534E;font-size:13px;line-height:1.5}.legend span{display:inline-flex;align-items:center;gap:7px}.legend i{width:10px;height:10px;border-radius:50%;background:var(--marker);display:inline-block;flex:0 0 auto}.legend i.square{border-radius:2px}.sim-status{font-size:13px;color:var(--muted);padding:0 13px;margin:7px 0 10px;min-height:20px}.fp-formulas:not(:empty){border-top:1px solid var(--border);padding:13px 22px;overflow:auto;background:#fff}.fp-formulas h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 7px}.fp-formulas math{font-size:16px}.controls{border:1px solid var(--border);border-radius:18px;background:var(--paper);padding:20px;position:sticky;top:24px}.controls h2{font-size:16px;font-weight:650;margin:0 0 17px}.controls .initial-title{border-top:1px solid var(--border);padding-top:17px;margin-top:19px}.control-row{margin:0 0 17px}.control-row label{display:flex;align-items:flex-start;justify-content: </style></head><body><div class="layout"><nav id="nav" class="sidebar" aria-label="Course chapters"></nav><main class="main" id="detail"></main></div><script>const models=[
{id:'logistic',ch:1,title:'Logistic population growth',type:'1D ODE',desc:'A closed population grows quickly when sparse and slows as it approaches a carrying capacity K.',eq:'dx/dt = r x (1 ? x/K)',compare:'The exponential model has no density-dependent limit; logistic growth adds crowding through the factor (1 ? x/K).',state:['x'],range:[[0,14]],params:{r:[1,.1,2,.05],K:[8,2,14,.5]},init:[1],f:(s,p)=>[p.r*s[0]*(1-s[0]/p.K)]},
{id:'saddle-node',ch:1,title:'Saddle-node bifurcation',type:'1D ODE �� normal form',desc:'A stable and an unstable equilibrium are created together as the control parameter crosses its critical value.',eq:'dx/dt = �� ? x��\nEquilibria (�� > 0): x* = �����',compare:'The harvested logistic and spruce budworm models show biological settings where equilibria collide or disappear; this normal form isolates that local transition.',state:['x'],range:[[-2,2]],params:{mu:[.5,-1,1,.02]},init:[-1.5],f:(s,p)=>[p.mu-s[0]*s[0]]},
{id:'transcritical',ch:1,title:'Transcritical bifurcation',type:'1D ODE �� normal form',desc:'Two equilibria meet and exchange stability as a parameter changes sign.',eq:'dx/dt = ��x ? x��\nEquilibria: x* = 0, ��',compare:'Unlike a saddle-node, the equilibria already exist on both sides of the transition; they cross and swap stability.',state:['x'],range:[[-2,2]],params:{mu:[.5,-1,1,.02]},init:[1.3],f:(s,p)=>[p.mu*s[0]-s[0]*s[0]]},
{id:'pitchfork-super',ch:1,title:'Supercritical pitchfork',type:'1D ODE �� normal form',desc:'A symmetric pair of stable equilibria branches from an unstable central state when the parameter becomes positive.',eq:'dx/dt = ��x ? x��\nFor �� > 0: x* = 0, �����',compare:'This normal form requires symmetry. It differs from transcritical bifurcation, where two branches cross rather than split symmetrically.',state:['x'],range:[[-2,2]],params:{mu:[.5,-1,1,.02]},init:[.3],f:(s,p)=>[p.mu*s[0]-s[0]*s[0]*s[0]]},
{id:'pitchfork-sub',ch:1,title:'Subcritical pitchfork',type:'1D ODE �� normal form',desc:'An unstable symmetric pair meets the stable central equilibrium as the parameter changes sign.',eq:'dx/dt = ��x + x��\nFor �� < 0: x* = 0, ����(?��)',compare:'The local normal form predicts unstable outer branches; higher-order terms in a biological model may create stabilising states farther away.',state:['x'],range:[[-2,2]],params:{mu:[-.5,-1,1,.02]},init:[.3],f:(s,p)=>[p.mu*s[0]+s[0]*s[0]*s[0]]},
{id:'exponential',ch:1,title:'Exponential growth and decay',type:'1D ODE',desc:'A large population in a closed environment changes at a per-capita rate that is independent of its current size.',eq:'dx/dt = r x',compare:'This is the low-density limit of logistic growth. With r > 0 it grows without bound; with r < 0 it decays.',state:['x'],range:[[0,12]],params:{r:[.45,-.5,1,.05]},init:[1],f:(s,p)=>[p.r*s[0]]},
{id:'mass-action',ch:1,title:'Mass-action reaction kinetics',type:'2D ODE �� A?B projection',desc:'The rate of an elementary reaction is proportional to the product of reactant concentrations. Here, two reactants form a product in a single irreversible step.',eq:'A + 2B �� C\ndA/dt = ?kAB��\ndB/dt = ?2kAB��\ndC/dt = kAB��',compare:'Mass action supplies the general recipe for writing chemical-kinetic ODEs. Michaelis?Menten adds enzyme binding, a transient complex and catalytic product release.',state:['A','B'],range:[[0,5],[0,5]],params:{k:[.15,.02,.4,.01]},init:[4.5,4.5],f:(s,p)=>[-p.k*s[0]*s[1]*s[1],-2*p.k*s[0]*s[1]*s[1]]},
{id:'sis',ch:1,title:'SIS epidemic model',type:'1D ODE �� reduced',desc:'Susceptible individuals become infected and recover back to susceptibility. With fixed total population N, the system reduces to one equation for I.',eq:'dI/dt = ��(1 ? I/N)I ? (�� + ��)I\nEquivalently: dI/dt = (�� ? �� ? ��)I ? (��/N)I��',compare:'This is the single-population precursor to the two-population SIS model in Chapter 2, where infection passes between distinct groups.',state:['I'],range:[[0,12]],params:{lambda:[1.4,.2,2.5,.05],gamma:[.35,0,1,.05],delta:[.05,0,.5,.01],N:[10,3,14,.5]},init:[1],f:(s,p)=>[p.lambda*(1-s[0]/p.N)*s[0]-(p.gamma+p.delta)*s[0]]},
{id:'harvest',ch:1,title:'Logistic growth with harvesting',type:'1D ODE',desc:'Constant-rate harvesting can lower the sustainable population and, above a critical rate, remove all positive equilibria.',eq:'dx/dt = r x (1 ? x/K) ? H\nCritical harvest: Hc = rK/4',compare:'Unlike unharvested logistic growth, the stable and unstable equilibria collide in a saddle-node bifurcation as H rises.',state:['x'],range:[[0,13]],params:{r:[1,.1,2,.05],K:[10,3,14,.5],H:[1,0,3,.05]},init:[1],f:(s,p)=>[p.r*s[0]*(1-s[0]/p.K)-p.H]},
{id:'budworm',ch:1,title:'Spruce budworm outbreak',type:'1D ODE',desc:'Logistic growth competes with a saturating predation response: birds consume few budworms at low density, then predation rises sharply.',eq:'dN/dt = rN(1 ? N/K) ? BN��/(A�� + N��)',compare:'Compared with constant harvesting, density-dependent predation can create a low-density refuge and bistability between refuge and outbreak states.',state:['N'],range:[[0,14]],params:{r:[.55,.1,1.2,.02],K:[12,5,18,.5],B:[1.4,.2,3,.05],A:[3,.5,6,.1]},init:[1],f:(s,p)=>[p.r*s[0]*(1-s[0]/p.K)-p.B*s[0]*s[0]/(p.A*p.A+s[0]*s[0])]},
{id:'mm',ch:1,title:'Michaelis?Menten enzyme kinetics',type:'2D ODE �� substrate?complex projection',desc:'A substrate binds an enzyme, forms a complex, then releases product and regenerates the enzyme. The plot shows substrate and enzyme?substrate complex; product accumulates as k��c.',eq:'S + E ? SE �� P + E\nds/dt = ?k��s(E? ? c) + k?��c\ndc/dt = k��s(E? ? c) ? (k?�� + k��)c\ndp/dt = k��c',compare:'The quasi-steady-state approximation eliminates fast complex dynamics and yields the familiar saturating rate v = Vmax��s/(Km + s).',state:['s','c'],range:[[0,12],[0,3]],params:{k1:[.8,.1,1.8,.05],km:[.5,.1,1.5,.05],k2:[.5,.1,1.2,.05],Et:[1,.3,1.5,.05]},init:[8,0],f:(s,p)=>{let c=Math.min(s[1],p.Et);return[-p.k1*s[0]*(p.Et-c)+p.km*c,p.k1*s[0]*(p.Et-c)-(p.km+p.k2)*c]}},
{id:'pdpc',ch:1,title:'Phosphorylation?dephosphorylation cycle',type:'1D ODE �� reduced',desc:'Kinase and phosphatase enzymes drive a protein between unmodified W and modified W*. Saturating enzyme kinetics can create a sharp, switch-like response.',eq:'dW*/dt = v��(W) ? v��(W*)\nv�� = V�� W/(K�� + W),   v�� = V�� W*/(K�� + W*)\nW + W* = W?',compare:'This two-enzyme cycle extends the single-substrate Michaelis?Menten pathway and can produce ultrasensitivity when both enzymes are saturated.',state:['W*'],range:[[0,1]],params:{V1:[.7,.1,1.5,.05],V2:[.7,.1,1.5,.05],K1:[.08,.02,.4,.01],K2:[.08,.02,.4,.01],Wt:[1,.5,1.5,.05]},init:[.08],f:(s,p)=>{let w=Math.max(0,p.Wt-s[0]);return[p.V1*w/(p.K1+w)-p.V2*s[0]/(p.K2+s[0])]}},
{id:'sis2',ch:2,title:'Two interacting SIS populations',type:'2D ODE',desc:'Infection spreads between two groups, each with its own recovery rate and cross-group transmission rate.',eq:'du/dt = R(1 ? u)v ? u\ndv/dt = R*(1 ? v)u ? v',compare:'The one-population SIS model reduces to logistic growth. Here, cross-infection couples the groups, so the phase portrait reveals whether infection dies out or persists in both.',state:['u','v'],range:[[0,1],[0,1]],params:{R:[1.4,.2,3,.05],Rs:[1.1,.2,3,.05]},init:[.12,.7],f:(s,p)=>[p.R*(1-s[0])*s[1]-s[0],p.Rs*(1-s[1])*s[0]-s[1]]},
{id:'lv',ch:2,title:'Lotka?Volterra predator?prey',type:'2D ODE',desc:'Prey grow without predators; predators decline without prey. Encounters transfer growth from prey to predator.',eq:'dN/dt = aN ? bNP\ndP/dt = ?dP + cNP',compare:'The classical model has closed orbits around coexistence, so oscillation amplitude depends on initial conditions. Chapter 3 adds saturation and logistic growth for more realistic dynamics.',state:['N','P'],range:[[0,12],[0,8]],params:{a:[1,.2,1.8,.05],b:[.18,.03,.4,.01],c:[.12,.03,.35,.01],d:[.7,.2,1.4,.05]},init:[5,2],f:(s,p)=>[p.a*s[0]-p.b*s[0]*s[1],-p.d*s[1]+p.c*s[0]*s[1]]},
{id:'switch',ch:2,title:'Autoregulatory genetic switch',type:'2D ODE',desc:'A gene product stimulates its own production through positive feedback. Protein and mRNA dynamics can produce multiple steady states.',eq:'du/d�� = a v ? b u\ndv/d�� = u��/(1 + u��) ? v\nu: protein concentration; v: mRNA concentration',compare:'The course uses positive autoregulation, not a two-gene mutual-repression circuit. The resulting bistability is conceptually related to the spruce budworm��s refuge/outbreak states.',state:['u','v'],range:[[0,4],[0,1.2]],params:{a:[1.2,.2,2,.05],b:[.5,.1,1,.02]},init:[.2,.9],f:(s,p)=>[p.a*s[1]-p.b*s[0],s[0]*s[0]/(1+s[0]*s[0])-s[1]]},
{id:'wc',ch:2,title:'Wilson?Cowan neural populations',type:'2D ODE',desc:'Mean firing rates of two neural populations relax toward sigmoid responses to recurrent and cross-population input.',eq:'��� du��/dt = ?u�� + F(w����u�� + w����u�� + I��)\n��� du��/dt = ?u�� + F(w����u�� + w����u�� + I��)\nF(z) = 1/(1 + e^(?��(z ? uT)))',compare:'Unlike spiking-neuron models, Wilson?Cowan tracks population firing rates. The course��s two-group setting describes competition and bistable dominance.',state:['u��','u��'],range:[[0,1],[0,1]],params:{gain:[8,2,16,.5],cross:[2,-4,5,.1],bias:[0,-2,2,.1]},init:[.15,.75],f:(s,p)=>{let F=z=>1/(1+Math.exp(-p.gain*z));return[-s[0]+F(2*s[0]-p.cross*s[1]+p.bias),-s[1]+F(2*s[1]-p.cross*s[0]+p.bias)]}},
{id:'competition',ch:2,title:'Competition between two species',type:'2D ODE',desc:'Two populations grow logistically in isolation; each reduces the other��s per-capita growth through interspecific competition.',eq:'dN��/dt = r��N��(1 ? N��/K�� ? b����N��/K��)\ndN��/dt = r��N��(1 ? N��/K�� ? b����N��/K��)',compare:'The Lotka?Volterra model couples prey and predator through consumption. This model uses competitive suppression and can produce coexistence or winner-take-all outcomes.',state:['N��','N��'],range:[[0,12],[0,12]],params:{b12:[.8,0,2,.05],b21:[.8,0,2,.05]},init:[2,7],f:(s,p)=>[s[0]*(1-s[0]/10-p.b12*s[1]/10),.9*s[1]*(1-s[1]/10-p.b21*s[0]/10)]},
{id:'hopfield',ch:2,title:'Continuous-time Hopfield network',type:'2D ODE �� two-unit example',desc:'A continuous neural network with symmetric weights descends an energy function and settles into a stable memory state.',eq:'��? dx?/dt = ?x? + ��? W?? g(x?) + I?\nW?? = W??;   g(z) = tanh(��z)',compare:'The Wilson?Cowan model focuses on interacting population firing rates. The Hopfield model emphasizes symmetric connectivity, an energy landscape and associative memory.',state:['x��','x��'],range:[[-1.5,1.5],[-1.5,1.5]],params:{coupling:[1,-1.5,1.5,.05],beta:[2,.5,5,.1]},init:[-.9,.6],f:(s,p)=>[-s[0]+Math.tanh(p.beta*(s[0]+p.coupling*s[1])), -s[1]+Math.tanh(p.beta*(p.coupling*s[0]+s[1]))]},
{id:'feedback',ch:3,title:'Delayed negative-feedback oscillator',type:'2D ODE',desc:'A two-component feedback loop can spiral toward a resting state. Strong positive feedback relative to decay produces damped oscillations.',eq:'dx/dt = f(y) ? ���x\ndy/dt = g(x) ? ���y',compare:'Damped oscillations lose amplitude. Adding further stages of inhibition, as in the repressilator, can destabilize the rest state and yield sustained oscillations.',state:['x','y'],range:[[0,5],[0,5]],params:{decay:[.45,.1,1,.02],feedback:[2,.2,4,.05]},init:[.3,3.8],f:(s,p)=>[2/(1+s[1]*s[1])-p.decay*s[0],p.feedback*s[0]/(1+s[0])-p.decay*s[1]]},

function trajectory(m,p,y){
 const key=JSON.stringify([m.id,p,y]);if(cache?.key===key)return cache.path;
 let path=[y.slice()],t=0,h=m.id==='hh'?.005:.025,T=m.id==='fhn'?300:40,status='';const times=[0];
 for(let step=0;step<80000&&t<T;step++){
  h=Math.min(h,T-t);let a=rk4(m.f,y,h,p),half=rk4(m.f,y,h/2,p),b=rk4(m.f,half,h/2,p);
  let err=Math.max(...a.map((v,j)=>Math.abs(v-b[j])/(1e-7+1e-5*Math.max(Math.abs(y[j]),Math.abs(b[j])))))/15;
  if(!Number.isFinite(err)){h/=2;if(h<1e-8){status='Integration stopped: singular or divergent solution.';break}continue}
  if(err>1){h*=Math.max(.2,.85*Math.pow(err,-.2));continue}
  y=b;t+=h;path.push(y.slice());times.push(t);
  if(m.id==='harvest'&&y[0]<=0){path[path.length-1]=[0];status='Population reached extinction; harvesting stops here.';break}
  if(y.some(v=>Math.abs(v)>1e5)){status='Unbounded trajectory; integration stopped.';break}
  h=Math.min(m.id==='hh'?.025:.15,h*Math.min(2,err>0?.9*Math.pow(err,-.2):2));
 }
 cache={key,path,times,status};return path;
}
function roots(m,p){
 let n=m.state.length;if(n>2)return [];
 const f=s=>m.f(s,p),found=[],r=m.range;
 const add=s=>{if(s.every((v,i)=>Number.isFinite(v)&&v>=r[i][0]-1e-6&&v<=r[i][1]+1e-6)&&Math.hypot(...f(s))<1e-6&&!found.some(z=>Math.hypot(...z.map((v,i)=>v-s[i]))<1e-4))found.push(s)};
 for(let i=0;i<=24;i++)for(let j=0;j<(n===1?1:25);j++){
  let s=[r[0][0]+i/24*(r[0][1]-r[0][0])];if(n===2)s.push(r[1][0]+j/24*(r[1][1]-r[1][0]));
  for(let k=0;k<40;k++){let v=f(s);if(Math.hypot(...v)<1e-9)break;let J=jac(m,p,s),d;
   if(n===1){if(Math.abs(J[0][0])<1e-12)break;d=[v[0]/J[0][0]]}else{let det=J[0][0]*J[1][1]-J[0][1]*J[1][0];if(Math.abs(det)<1e-12)break;d=[(v[0]*J[1][1]-v[1]*J[0][1])/det,(J[0][0]*v[1]-J[1][0]*v[0])/det]}
   s=s.map((v,k)=>v-d[k]);if(s.some(v=>!Number.isFinite(v)||Math.abs(v)>1e6))break;
  }add(s);
 }return found;
}
function jac(m,p,s){let n=s.length,J=Array.from({length:n},()=>[]);for(let j=0;j<n;j++){let a=s.slice(),b=s.slice(),e=1e-5*(1+Math.abs(s[j]));a[j]+=e;b[j]-=e;let fa=m.f(a,p),fb=m.f(b,p);for(let i=0;i<n;i++)J[i][j]=(fa[i]-fb[i])/(2*e)}return J}
function stability(m,p,s){let J=jac(m,p,s);if(s.length===1)return Math.abs(J[0][0])<1e-5?'Nonhyperbolic':J[0][0]<0?'Stable':'Unstable';let tr=J[0][0]+J[1][1],det=J[0][0]*J[1][1]-J[0][1]*J[1][0];return Math.abs(det)<1e-6?'Nonhyperbolic':det<0?'Saddle':Math.abs(tr)<1e-5?'Neutral / inconclusive':tr<0?'Stable':'Unstable'}

 const idx=Math.min(samples,Math.floor(clock/40*samples)),state=path[idx],q=project(state);g.fillStyle='#777E79';g.beginPath();g.roundRect(q[0]-3,q[1]-3,6,6,1.5);g.fill();label('I.C.',q[0]+8,q[1]+16);document.getElementById('legend-'+m.id).innerHTML='<span><i style="--marker:#A8ADD0"></i>Saddle F.P.</span><span><i style="--marker:#CAB6CF"></i>Unstable F.P.</span><span><i class="square" style="--marker:#777E79;width:6px;height:6px"></i>I.C. / moving state</span><span><i style="--marker:#6E8D7D"></i>Travelling-wave orbit (�� increases)</span>';c.style.touchAction='none';if(typeof c.addEventListener==="function"&&!orbitBound3D.has(c)){orbitBound3D.add(c);c.addEventListener('pointerdown',e=>{if(running)stopAndReset();orbitDrag={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!orbitDrag)return;cameraYaw+=(e.clientX-orbitDrag.x)*.009;cameraPitch=Math.max(-1.45,Math.min(1.45,cameraPitch+(e.clientY-orbitDrag.y)*.009));orbitDrag={x:e.clientX,y:e.clientY};drawSpatial3D()});c.addEventListener('pointerup',()=>orbitDrag=null);c.addEventListener('pointercancel',()=>orbitDrag=null);c.addEventListener('wheel',e=>{e.preventDefault();cameraZoom=Math.max(.55,Math.min(1.8,cameraZoom*Math.exp(-e.deltaY*.001)));drawSpatial3D()},{passive:false})}

function drawDampedNoise(){

 for(let i=1;i<8;i++)for(let j=1;j<8;j++){const x=x0+i/8*(x1-x0),y=y0+j/8*(y1-y0),u=-.12*x-y,v=x-.12*y,s=10/Math.max(1,Math.hypot(u,v));arrow(g,X(x),Y(y),u*s,-v*s,10,'rgba(95,140,119,.25)')}

function noiseGaussian(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
